[build]
  command = "pnpm build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]

# API requests are handled by the Express app running as a serverless function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Client-side routing fallback for the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
