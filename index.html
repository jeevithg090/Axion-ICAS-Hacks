<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICAS Student Life Assistant</title>
    <meta
      name="description"
      content="Student Life Assistant for ICAS students: transfer tracking, study centre, academic planning, peer buddies and AI-assisted meeting summaries."
    />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#f97316" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:title" content="ICAS Student Life Assistant" />
    <meta
      property="og:description"
      content="Advancing knowledge. Improving lives."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ICAS Student Life Assistant" />
    <meta
      name="twitter:description"
      content="Advancing knowledge. Improving lives."
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = t
            ? t === "dark"
            : window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (d) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <noscript>This application requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
