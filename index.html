<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICAS Student Life Assistant</title>
    <meta
      name="description"
      content="Student Life Assistant for ICAS students: transfer tracking, study centre, academic planning, peer buddies and AI-assisted meeting summaries."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#070c18"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:site_name" content="ICAS Student Life Assistant" />
    <meta property="og:title" content="ICAS Student Life Assistant" />
    <meta
      property="og:description"
      content="Transfer tracking, study tools, academic planning and AI-assisted meeting summaries for ICAS students."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ICAS Student Life Assistant: transfer, study and planning tools for ICAS students"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ICAS Student Life Assistant" />
    <meta
      name="twitter:description"
      content="Transfer tracking, study tools, academic planning and AI-assisted meeting summaries for ICAS students."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = t
            ? t === "dark"
            : window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (d) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <noscript
      >ICAS Student Life Assistant needs JavaScript enabled to run.</noscript
    >
    <div id="root"></div>
    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
